name: Weekly Stock Ranking

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
          # Quick validation
          python -c "import json; json.load(open('credentials.json')); print('credentials.json is valid JSON')"

      - name: Run ranking + accuracy update
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          cd src
          python rank.py
